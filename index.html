<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>露西亚 - 灰鸦小队</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <!-- 对话框 -->
        <div class="chat-box">
            <div class="messages" id="messagesContainer">
                <div class="message ai-message">
                    <div class="message-bubble">
                        <p>这里是灰鸦小队队长，露西亚。很高兴认识你。</p>
                        <span class="timestamp">12:00 PM</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入框 -->
        <div class="input-area">
            <textarea id="messageInput" class="message-input" placeholder="输入消息... (Shift + Enter 换行)" rows="1"></textarea>
            <button id="sendBtn" class="send-button">发送</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
