<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>露西亚 - 灰鸦小队</title>
    <link rel="stylesheet" href="style.css?v=13">
</head>
<body>
    <div class="chat-container">
        <!-- 设置按钮 -->
        <button id="settingsBtn" class="settings-btn" title="API 设置">⚙️</button>

        <!-- 设置面板 -->
        <div id="settingsPanel" class="settings-panel hidden">
            <div class="settings-content">
                <h3>API 设置</h3>
                <label for="apiKeyInput">DeepSeek API Key:</label>
                <input type="password" id="apiKeyInput" placeholder="输入你的 API Key" class="api-key-input">
                <div class="settings-buttons">
                    <button id="saveApiBtn" class="settings-save-btn">保存</button>
                    <button id="clearApiBtn" class="settings-clear-btn">清除</button>
                    <button id="closeSettingsBtn" class="settings-close-btn">关闭</button>
                </div>
                <p class="settings-hint">API Key 将被保存在浏览器本地, 不会上传到服务器。</p>
            </div>
        </div>

        <!-- 对话框 -->
        <div class="chat-box">
            <div class="messages" id="messagesContainer">
                <div class="message ai-message">
                    <img src="屏幕截图_18-2-2026_151930_pns.kurogames.com.jpeg" alt="露西亚" class="avatar ai-avatar">
                    <div class="message-bubble">
                        <p>这里是灰鸦小队队长，露西亚。很高兴认识你。</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入框 -->
        <div class="input-area">
            <textarea id="messageInput" class="message-input" placeholder="输入消息... (Shift + Enter 换行)" rows="1"></textarea>
            <button id="sendBtn" class="send-button">发送</button>
        </div>
    </div>

    <script src="script.js?v=8"></script>
</body>
</html>
